" font-size="16" font-weight="400" text-anchor="start">บันทึกผลการดำเนินงาน</text><text x="546" y="280" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">ไม่สม่ำเสมอ</text><path d="M 852 267 H 883.3705357142857" stroke="#118B88" stroke-width="4"/><circle cx="883.3705357142857" cy="267" r="9" fill="#118B88" stroke="white" stroke-width="2"/></g><g data-fishbone="2"><path d="M 330 540 L 415 324" stroke="#167BB0" stroke-width="6"/><rect x="40" y="540" width="385" height="64" rx="22" fill="#167BB0"/><circle cx="71" cy="572" r="26" fill="white" fill-opacity=".15"/><text x="71" y="581" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">3</text><text x="110" y="567" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">การจัดทำรายงาน</text><text x="110" y="591" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">ไม่มีประสิทธิภาพ</text><rect x="40" y="370" width="322" height="82" rx="15" fill="#167BB0" fill-opacity=".09"/><text x="56" y="393" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">จัดทำรายงานใช้เวลานาน</text><text x="56" y="418" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">และไม่แม่นยำ</text><path d="M 362 405 H 383.125" stroke="#167BB0" stroke-width="4"/><circle cx="383.125" cy="405" r="9" fill="#167BB0" stroke="white" stroke-width="2"/><rect x="40" y="460" width="322" height="82" rx="15" fill="#167BB0" fill-opacity=".09"/><text x="56" y="501" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">เอกสารรายงานชำรุดเสียหาย</text><path d="M 362 495 H 347.70833333333337" stroke="#167BB0" stroke-width="4"/><circle cx="347.70833333333337" cy="495" r="9" fill="#167BB0" stroke="white"