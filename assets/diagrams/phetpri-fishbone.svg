<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="สาเหตุของปัญหาระบบเดิม"><title>สาเหตุของปัญหาระบบเดิม</title><desc>แผนภาพสรุป อ่านรายละเอียดและแหล่งอ้างอิงในหน้าสไลด์</desc><rect width="1200" height="660" fill="#FFFFFF"/><path d="M 32 324 H 988" stroke="#103D60" stroke-width="7"/><path d="M 988 324 l -18 -12 v24 Z" fill="#103D60"/><rect x="1005" y="246" width="177" height="162" rx="8" fill="#103D60" stroke="#087F5B" stroke-width="2"/><text x="1093" y="310" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ระบบร้องเรียนปัญหา</text><text x="1093" y="339" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">สาธารณะเดิม</text><text x="1093" y="368" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">มีประสิทธิภาพต่ำ</text><g data-fishbone="0"><path d="M 330 100 L 415 324" stroke="#167DA0" stroke-width="6"/><rect x="40" y="40" width="385" height="64" rx="22" fill="#167DA0"/><circle cx="71" cy="72" r="26" fill="white" fill-opacity=".15"/><text x="71" y="81" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">1</text><text x="110" y="79" fill="#FFFFFF" font-family="Kanit, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">ข้อจำกัดด้านการสื่อสาร</text><rect x="40" y="135" width="322" height="82" rx="15" fill="#167DA0" fill-opacity=".09"/><text x="56" y="158" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">ไม่มีช่องทางแจ้งปัญหาที่มีประสิทธิภาพ</text><text x="56" y="183" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">ประชาชนยังต้องโทรศัพท์</text><text x="56" y="208" fill="#102A20" font-family="Kanit, Arial, sans-serif" font-size="16" font-weight="400" tex